name: Test & Lint

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  # ─────────────────────────────────────────────
  # Job 1 – Enforce code style via pre-commit
  # Runs black, flake8 (Python) and clang-format (C++)
  # as defined in .pre-commit-config.yaml
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.0

  # ─────────────────────────────────────────────
  # Job 2 – Build the Docker image and run
  # test_env.sh to validate the dev environment
  # (Python venv, g++, cmake, Rust, mdbook, etc.)
  # ─────────────────────────────────────────────
  env-check:
    name: Docker Environment Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Cache Docker layers keyed on Dockerfile + requirements.txt
      # so expensive steps (grSim build, Rust install) are reused
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: my_ssl:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Rotate cache to prevent unbounded growth
      - name: Rotate cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Run environment sanity check
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            my_ssl:ci \
            bash /workspace/test_env.sh
