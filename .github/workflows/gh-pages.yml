name: Docs

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  # ─────────────────────────────────────────────
  # Job 1 – Build docs on every PR and push.
  # Catches mdBook compilation errors before merge.
  # ─────────────────────────────────────────────
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Build
        run: mdbook build docs/

      # Upload the built book so the deploy job can use it
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/book

  # ─────────────────────────────────────────────
  # Job 2 – Deploy to GitHub Pages.
  # Only runs on push to dev (never on PRs).
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy Docs
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: ${{ github.workflow }}-deploy
      cancel-in-progress: true

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
