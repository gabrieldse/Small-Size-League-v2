services:
  dev:
    image: small-size-league-v2-dev:latest
    container_name: my_ssl
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    network_mode: host
    stdin_open: true
    tty: true
    working_dir: /workspace
